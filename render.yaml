services:
  - type: web
    name: nextgen-garment-erp-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: nextgen-erp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://bloom-works-garment-erp.vercel.app","https://bloomworks-garment-erp.onrender.com","http://localhost:3000","http://localhost:5173"]'
      - key: API_PREFIX
        value: /api

  - type: web
    name: nextgen-garment-erp-ui
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://bloomworks-garment-erp.onrender.com/api

databases:
  - name: nextgen-erp-db
    plan: free
    databaseName: nextgen_erp
    user: nextgen_erp_user